<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SBL — варианты огонька</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eceae5;color:#111;font-family:Arial,Helvetica,sans-serif;padding:28px 20px 52px}main{max-width:1040px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}h1{font-size:28px;letter-spacing:-.8px;margin:0}header a,.back{color:#555;font-size:14px}p{line-height:1.5;color:#67645e}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.option{background:#fff;border-radius:28px;overflow:hidden;border:2px solid transparent}.option.selected{border-color:#e8500a}.material{height:200px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse,#f3eee7,white 65%)}.sprite{position:relative;overflow:hidden;flex-shrink:0}.sprite img{position:absolute;max-width:none;user-select:none;pointer-events:none}.copy{padding:0 20px 22px}.copy h2{font-size:19px;margin:0 0 6px}.copy p{font-size:13px;margin:0;min-height:40px}.sample{display:flex;gap:8px;align-items:center;background:#f5f4f0;padding:16px;border-radius:16px;margin:16px 0;font-size:14px;font-weight:700}.choose{min-height:44px;border:0;border-radius:100px;background:#111;color:white;padding:0 22px;font:700 14px Arial;cursor:pointer;width:100%}.selected .choose{background:#e8500a}.selection{margin-top:20px;font-size:14px;min-height:22px}.foot{font-size:13px}.fire-letter{font-size:12px;font-weight:700;letter-spacing:1px;color:#e8500a;text-transform:uppercase}.sprite.shine{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-3px)}}@media(prefers-reduced-motion:reduce){.sprite.shine{animation:none}}@media(max-width:600px){header{display:block}header a{display:block;margin-top:12px}h1{font-size:24px}.grid{gap:12px}.material{height:160px}.copy{padding:0 12px 16px}.copy h2{font-size:16px}.copy p{min-height:64px}.sample{padding:12px 8px;font-size:12px;min-height:64px}.choose{padding:0 10px;font-size:12px}}
</style>
<main><header><h1>Какой огонёк ближе к SBL?</h1><a href="card-options.html">Варианты карты SBL →</a></header><p>Объём и материал вместо плоского значка. Ниже каждый вариант показан крупно и в размере строки серии.</p><div class="grid" id="flames"></div><div class="selection" id="choice" aria-live="polite">Вариант пока не выбран.</div><p class="foot">Это сравнение вариантов. Выбор здесь не меняет приложение и ничего не отправляет.</p></main>
<script>
const options=[
{id:'А',name:'Глянцевая эмаль',copy:'Тёплый оранжевый цвет, мягкий объём и небольшой блик.',frame:[174,32,433,545]},
{id:'Б',name:'Ювелирный хром',copy:'Серебристая оболочка и тёплое свечение внутри.',frame:[762,31,420,551]},
{id:'В',name:'Янтарное стекло',copy:'Полупрозрачное пламя с лёгким перламутровым краем.',frame:[174,585,445,562]},
{id:'Г',name:'Тёплая керамика',copy:'Мягкая матовая фактура, ближе к чашке и кофейному уюту.',frame:[746,598,439,562]}
];
function sprite(frame,height,animated=false){const [x,y,w,h]=frame,scale=height/h;return `<span class="sprite ${animated?'shine':''}" aria-hidden="true" style="display:inline-block;width:${w*scale}px;height:${height}px"><img src="flame-materials.png" style="width:${1330*scale}px;height:${1182*scale}px;left:${-x*scale}px;top:${-y*scale}px" alt=""></span>`;}
document.getElementById('flames').innerHTML=options.map(o=>`<section class="option" data-id="${o.id}"><div class="material">${sprite(o.frame,134,true)}</div><div class="copy"><span class="fire-letter">Вариант ${o.id}</span><h2>${o.name}</h2><p>${o.copy}</p><div class="sample">${sprite(o.frame,27)}<span>Серия ещё не началась</span></div><button class="choose" type="button" aria-pressed="false">Выбрать ${o.id}</button></div></section>`).join('');
document.getElementById('flames').addEventListener('click',e=>{const button=e.target.closest('.choose');if(!button)return;const item=button.closest('.option');document.querySelectorAll('.option').forEach(v=>{v.classList.toggle('selected',v===item);v.querySelector('button').setAttribute('aria-pressed',String(v===item));});const option=options.find(v=>v.id===item.dataset.id);document.getElementById('choice').textContent=`Выбран огонёк ${option.id}: ${option.name}. Напиши эту букву в чат.`;});
</script></html>
